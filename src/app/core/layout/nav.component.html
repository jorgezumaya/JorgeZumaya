<nav class="nav" [class.nav--open]="open()">
  <!-- Brand -->
  <a routerLink="/" class="nav__brand" aria-label="Home">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 440 80"
      height="28"
      role="img"
      aria-label="Jorge Zumaya"
    >
      <title>jorge.zumaya</title>
      <text
        x="220"
        y="56"
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="48"
        letter-spacing="-1"
        text-anchor="middle"
        fill="#FAFAFA"
      >
        jorge
        <tspan fill="#FF3D00">.</tspan>
        zumaya
      </text>
    </svg>
  </a>

  <!-- Desktop: inline links -->
  <ul class="nav__links nav__links--desktop">
    @for (link of navLinks; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      </li>
    }
    <li><a routerLink="/contact" routerLinkActive="active" class="nav__cta">Contact</a></li>
  </ul>

  <!-- Mobile: Contact CTA + hamburger -->
  <a
    routerLink="/contact"
    routerLinkActive="active"
    class="nav__cta nav__mobile-cta"
    (click)="close()"
  >
    Contact
  </a>
  <button
    class="nav__toggle"
    (click)="open.set(!open())"
    [attr.aria-expanded]="open()"
    aria-label="Toggle navigation"
  >
    <span></span><span></span><span></span>
  </button>

  <!-- Mobile: collapsible links (in-flow) -->
  <ul class="nav__links nav__links--mobile" [class.is-open]="open()">
    @for (link of navLinks; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="active" (click)="close()">{{ link.label }}</a>
      </li>
    }
  </ul>
</nav>
